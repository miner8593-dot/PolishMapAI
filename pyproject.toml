[project]
name = "polishmapai"
version = "0.3.0"
description = "Lossless Polish MP cartographic editor for Windows"
requires-python = ">=3.11"
dependencies = ["pyshp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
polishmapai = "polishmapai.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
