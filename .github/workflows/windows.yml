name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.12 toolcache currently pairs _tkinter with a Tcl layout that
          # fails after relocation in the portable PyInstaller bundle.
          # 3.11.9 is the last full Windows installer release and ships a
          # relocatable Tcl/Tk runtime.
          python-version: '3.11.9'
          cache: pip
      - name: Test and build
        shell: powershell
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PolishMapAI-Windows
          path: artifacts/*
